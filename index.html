<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/paragonpoly-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Paragon Poly Films Customer Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paragon Poly">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=3">

  <!-- Browser tab icon: logo mark only, no text -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/Icon-48.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/Icon-16.png?v=3">
  <link rel="shortcut icon" href="favicon.png?v=3">

  <title>Paragon Poly Films</title>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#00897B">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "1352008904";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
